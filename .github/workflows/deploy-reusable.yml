name: Reusable deploy

on:
  workflow_call:
    inputs:
      build_script:
        description: pnpm script to run (buildStaging or buildProd)
        required: true
        type: string
      deploy_path:
        description: Remote directory (e.g. /var/www/dev.productdesigntalks.eu)
        required: true
        type: string
      pm2_app:
        description: PM2 process name to restart
        required: true
        type: string
      health_port:
        description: Local port for post-deploy smoke test
        required: true
        type: string
      health_path:
        description: Path to curl after deploy
        required: false
        default: /en/events/
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install PNPM
        run: npm install -g pnpm@11.1.3

      - name: Configure Git for private GitHub dependency
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set — skipping private git dependency setup"
            exit 0
          fi
          git config --global credential.helper store
          {
            echo "https://x-access-token:${GH_PAT}@github.com"
            echo "https://x-access-token:${GH_PAT}@github.com/veresdaniel/ergodot-ui-kit.git"
          } > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Normalize git URLs in pnpm-lock.yaml
        id: normalize_lock
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then
            before=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
            sed -i \
              -e 's|git+https://git@github\.com:|git+https://github.com/|g' \
              -e 's|repo: git@github\.com:|repo: https://github.com/|g' \
              -e 's|: git@github\.com:|: https://github.com/|g' \
              pnpm-lock.yaml
            after=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
            if [ "$before" != "$after" ]; then
              echo "modified=true" >> "$GITHUB_OUTPUT"
              echo "::warning::pnpm-lock.yaml contained SSH-style git URLs; normalized for CI."
            fi
          fi

      - name: Install project dependencies with PNPM
        run: |
          if [ "${{ steps.normalize_lock.outputs.modified }}" = "true" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install
          fi

      - name: Build with Vite
        env:
          PUBLIC_API_BASE_URL: https://ergomania-test.azurewebsites.net
          API_BASE_URL: https://ergomania-test.azurewebsites.net
        run: pnpm run ${{ inputs.build_script }}

      - name: Verify build integrity
        run: node scripts/verify-server-chunks.mjs

      - name: Deploy build output
        run: |
          set -e
          DEPLOY_PATH="${{ inputs.deploy_path }}"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          STAGING="${DEPLOY_PATH}/.deploy-staging"
          SSH="ssh -p 22 ${REMOTE}"

          ${SSH} "mkdir -p ${DEPLOY_PATH} ${STAGING}/build ${STAGING}/node_modules"
          rsync -avz -e "ssh -p 22" deploy/ "${REMOTE}:${DEPLOY_PATH}/deploy/"
          rsync -avz --delete -e "ssh -p 22" build/ "${REMOTE}:${STAGING}/build/"
          rsync -avz --delete -e "ssh -p 22" node_modules/ "${REMOTE}:${STAGING}/node_modules/"
          ${SSH} "set -e
            cd ${DEPLOY_PATH}
            rm -rf build.previous node_modules.previous
            [ -d build ] && mv build build.previous
            [ -d node_modules ] && mv node_modules node_modules.previous
            mv ${STAGING}/build build
            mv ${STAGING}/node_modules node_modules
            rm -rf build.previous node_modules.previous ${STAGING}"

      - name: Ensure PM2 app exists
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ inputs.deploy_path }}"
            PM2_APP="${{ inputs.pm2_app }}"
            if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
              echo "PM2 app $PM2_APP already exists"
            elif [ -f "$DEPLOY_PATH/deploy/ecosystem.config.js" ]; then
              pm2 start "$DEPLOY_PATH/deploy/ecosystem.config.js"
              pm2 save
            else
              echo "::warning::ecosystem.config.js missing — start PM2 manually after first deploy"
            fi

      - name: Restart PM2 and verify
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            pm2 delete ${{ inputs.pm2_app }} 2>/dev/null || true
            pm2 start "$DEPLOY_PATH/deploy/ecosystem.config.js"
            pm2 save
            sleep 5
            for i in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${{ inputs.health_port }}${{ inputs.health_path }}" || true)
              if [ "$status" = "200" ] || [ "$status" = "301" ] || [ "$status" = "302" ] || [ "$status" = "307" ] || [ "$status" = "308" ]; then
                echo "Health check passed (HTTP $status)"
                exit 0
              fi
              echo "Attempt $i: HTTP $status — retrying..."
              sleep 3
            done
            echo "::error::Health check failed after deploy"
            pm2 logs ${{ inputs.pm2_app }} --lines 30 --nostream || true
            exit 1

      - name: cleanup
        if: always()
        run: rm -rf ~/.ssh
